---
layout: default
---
<div class="container page">
  <header class="page-header reveal">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1 class="page-title">{{ page.heading | default: page.title }}</h1>
    {% if page.subtitle %}<p class="page-subtitle">{{ page.subtitle }}</p>{% endif %}
  </header>
  <div class="page-body">
    {{ content }}
  </div>
</div>
