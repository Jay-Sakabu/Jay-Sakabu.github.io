<header class="nav-wrap" data-nav>
  <nav class="nav container" aria-label="Main">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark">{{ site.author.initials }}</span>
      <span class="brand-name">{{ site.author.name }}</span>
    </a>

    <ul id="nav-links" class="nav-links">
      {% for item in site.data.navigation %}
      <li><a href="{{ item.url | relative_url }}" {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.title }}</a></li>
      {% endfor %}
    </ul>

    <div class="nav-actions">
      <button class="icon-btn theme-toggle" type="button" aria-label="Toggle light and dark theme" data-theme-toggle>
        {% include icon.html name="sun" %}{% include icon.html name="moon" %}
      </button>
      <button class="icon-btn nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav-links" data-nav-toggle>
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>
</header>
